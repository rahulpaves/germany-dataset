<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening your file | Pave</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#f4f6fa;color:#131a2b;
       font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;justify-content:center;padding:60px 20px}
  .card{max-width:580px;width:100%;background:#fff;border:1px solid #dfe3ea;border-radius:16px;padding:36px}
  .eyebrow{font:600 11px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.12em;
           text-transform:uppercase;color:#2B50E8;margin-bottom:14px}
  h1{font-size:27px;line-height:1.12;letter-spacing:-.02em;margin:0 0 14px}
  p{color:#42506b;margin:0 0 14px}
  .countries{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 6px}
  .countries a{padding:8px 14px;border:1px solid #dfe3ea;border-radius:9px;
               text-decoration:none;color:#131a2b;font-size:14.5px;background:#fbfcfe}
  .countries a:hover{border-color:#2B50E8;color:#2B50E8}
  .go{display:inline-block;margin-top:18px;background:#2B50E8;color:#fff;padding:12px 22px;
      border-radius:9px;font-weight:600;font-size:15px;text-decoration:none}
  .muted{font-size:13.5px;color:#6b7891}
  .note{font-size:13.5px;color:#6b7891;border-top:1px solid #eef1f5;padding-top:18px;margin-top:26px}
  .err{background:#f8dee3;border:1px solid #edc2cb;color:#8d243a;padding:14px 16px;border-radius:10px}
  .row{display:flex;gap:8px;margin:18px 0 6px}
  input{flex:1;padding:11px 13px;border:1px solid #dfe3ea;border-radius:9px;font-size:15px}
  button{padding:11px 20px;border:0;border-radius:9px;background:#131a2b;color:#fff;
         font-size:15px;font-weight:600;cursor:pointer}
  a{color:#2B50E8}
  code{background:#eef1f7;padding:2px 6px;border-radius:5px;font-size:13.5px}
</style>

<div class="card" id="card">
  <div class="eyebrow">Checking your payment</div>
  <h1>One moment</h1>
  <p class="muted">Confirming with Stripe and opening the file.</p>
</div>

<script>
var BILLING = "https://billing.stripe.com/p/login/00w00ibbO8nwbJ62fl0Fi00";

var COUNTRIES = [
  ["singapore","Singapore"],["italy","Italy"],["australia","Australia"],
  ["spain","Spain"],["netherlands","Netherlands"],["france","France"],
  ["switzerland","Switzerland"],["germany","Germany"]
];

function card(html){ document.getElementById("card").innerHTML = html; }

function unlocked(email){
  var links = COUNTRIES.map(function(c){
    return '<a href="file.html?country=' + c[0] + '">' + c[1] + '</a>';
  }).join("");
  card(
    '<div class="eyebrow">You\'re in</div>' +
    '<h1>All eight countries are open</h1>' +
    '<p>This browser is unlocked for a year. Open any country and every field carries its ' +
    'source link, the sentence it came from and the date it was checked.</p>' +
    (email ? '<p class="muted">Receipt sent to ' + email + '. If that address is wrong, ' +
             'tell us and we will fix it.</p>' : '') +
    '<div class="countries">' + links + '</div>' +
    '<a class="go" href="file.html?country=italy">Start with Italy</a>' +
    '<div class="note">Using a different laptop later? Open this page again from your ' +
    'receipt address on this page and it opens there too.' +
    '<br><br>Cancel or change your card on your ' +
    '<a href="' + BILLING + '">billing page</a>. Cancelling stops the renewal, ' +
    'and the file stays open until the year you paid for runs out.' +
    '<br><br>Anything odd, mail ' +
    '<a href="mailto:rahul@pavetheway.ai">rahul@pavetheway.ai</a> or <a href="https://wa.me/971568924365">WhatsApp +971 56 892 4365</a>.</div>'
  );
}

function manualEntry(message){
  card(
    '<div class="eyebrow">Almost there</div>' +
    '<h1>We could not confirm that automatically</h1>' +
    '<div class="err">' + message + '</div>' +
    '<p style="margin-top:16px">Put in the email you paid with and we will find it.</p>' +
    '<div class="row"><input id="code" type="email" placeholder="you@yourpractice.com" autocomplete="email">' +
    '<button id="go">Open it</button></div>' +
    '<div class="err" id="err" style="display:none"></div>' +
    '<div class="note">Your payment is not in question. If this does not open, mail ' +
    '<a href="mailto:rahul@pavetheway.ai">rahul@pavetheway.ai</a> or <a href="https://wa.me/971568924365">WhatsApp +971 56 892 4365</a>, ' +
    'and it gets opened by hand, usually the same day.</div>'
  );
  document.getElementById("go").onclick = function(){
    var v = (document.getElementById("code").value || "").trim();
    if (!v) return;
    fetch("/api/restore?email=" + encodeURIComponent(v))
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(out){
        if (out.ok && out.j.token){
          try { localStorage.setItem("pave-access", out.j.token); } catch(e){}
          unlocked(null);
          return;
        }
        var e = document.getElementById("err");
        e.style.display = "block";
        e.textContent = out.j.message || "We could not find a payment against that address.";
      });
  };
}

(function(){
  var sid = new URLSearchParams(location.search).get("session_id");

  // Already unlocked on this browser, and no new payment to process.
  if (!sid) {
    var have = null;
    try { have = localStorage.getItem("pave-access"); } catch(e){}
    if (have) {
      fetch("/api/data?c=italy&k=" + encodeURIComponent(have))
        .then(function(r){ r.ok ? unlocked(null) : manualEntry("Your saved access has expired or is not recognised."); });
      return;
    }
    manualEntry("We did not get a payment reference from Stripe. That happens when this page is opened directly rather than from a receipt.");
    return;
  }

  fetch("/api/unlock?session_id=" + encodeURIComponent(sid))
    .then(function(r){ return r.json().then(function(j){ return {ok: r.ok, j: j}; }); })
    .then(function(out){
      if (out.ok && out.j.token) {
        try { localStorage.setItem("pave-access", out.j.token); } catch(e){}
        unlocked(out.j.email);
      } else {
        manualEntry(out.j.message || "Stripe has not confirmed this payment yet.");
      }
    })
    .catch(function(){
      manualEntry("We could not reach our server. Your payment is fine.");
    });
})();
</script>
